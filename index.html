<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header>
        <h1>Travel Planner</h1>
        <p>Plan your trips and explore new destinations!</p>
    </header>
    <main class="planner">
        <section class="trip-form">
            <h2>Create a New Trip</h2>
            <form id="trip-form">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" placeholder="e.g. Rome" required>

                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" required>

                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" required>

                <label for="budget">Budget:</label>
                <input type="number" id="budget" min="0" required>

                <button type="submit">Add Trip</button>
            </form>
            <p id="trip-summary">Enter your trip details to get started!</p>
        </section>
        <section class="map-section">
            <h2>Explore your route</h2>
            <p>Click the markers to discover the stops</p>
            <div id="map"></div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
