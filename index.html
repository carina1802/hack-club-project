<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
</head>
<body>
    <header>
        <h1>Travel Planner</h1>
        <p>Plan your trips and explore new destinations!</p>
        <button
            type="button"
            id="theme-toggle"
            aria-label="Switch to dark mode"
            aria-pressed="false"
        >
            <span id="theme-icon" aria-hidden="true">🌙</span>
            <span id="theme-label">Dark mode</span>
        </button>
    </header>
    <main class="planner">
        <section class="trip-form">
            <h2>Create a New Trip</h2>
            <form id="trip-form">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" placeholder="e.g. Rome" required>
                <fieldset class="category-filters">
                    <legend>Discover places</legend>
                    <label>
                        <input type="checkbox" name="category" value="attraction" checked>
                        Tourist attractions
                    </label>
                    <label>
                        <input type="checkbox" name="category" value="museum" checked>
                        Museums
                    </label>
                    <label>
                        <input type="checkbox" name="category" value="restaurant" checked>
                        Restaurants
                    </label>
                    <label>
                        <input type="checkbox" name="category" value="cafe" checked>
                        Cafés
                    </label>
                    <button type="button" id="search-places">Find places</button>
                </fieldset>

                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate">

                <label for="endDate">End Date:</label>
                <input type="date" id="endDate">

                <label for="budget">Budget:</label>
                <input type="number" id="budget" min="0">

                <button type="submit">Add Trip</button>
            </form>
            <p id="trip-summary">Enter your trip details to get started!</p>
            <div id="places-status" role="status" aria-live="polite"></div>
            <div id="places-list"></div>
            <button type="button" id="build-route">Build route from selected places</button>
        </section>
        <section class="map-section">
            <h2>Explore your route</h2>
            <p>Click the markers to discover the stops</p>
            <div id="map"></div>
            <div id="route-itinerary" class="route-itinerary" aria-live="polite"></div>
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
</body>
</html>
